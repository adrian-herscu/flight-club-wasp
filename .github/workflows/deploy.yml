name: Wasp Deploy

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: "0.21"
      RAILWAY_PROJECT_NAME: flight-club-wasp
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"

      - name: Install Wasp
        # We pin the Wasp CLI version to avoid issues when a new Wasp version is released.
        run: npm i -g @wasp.sh/wasp-cli@$WASP_VERSION

      - name: Install Railway CLI
        # Install via the official script to get the native binary (not the npm wrapper).
        # The npm wrapper's stdio:inherit causes railway whoami to fail in non-TTY subprocesses.
        run: bash <(curl -fsSL cli.new/install)

      - name: Deploy
        run: wasp deploy railway deploy $RAILWAY_PROJECT_NAME --existing-project-id $RAILWAY_PROJECT_ID
        env:
          # You must add RAILWAY_API_TOKEN to your Repository Secrets
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}