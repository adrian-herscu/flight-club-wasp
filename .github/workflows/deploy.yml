name: Wasp Deploy

on:
  push:
    branches:
      - main

env:
  WASP_VERSION: 0.21.1
  WASP_TELEMETRY_DISABLE: 1

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_club_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Passed to the Wasp dev server via .env.server created below
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flight_club_e2e

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Create .env.server for CI
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          cat > .env.server << EOF
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/flight_club_e2e
          SKIP_EMAIL_VERIFICATION_IN_DEV=true
          JWT_SECRET=supersecretjwtkey_for_ci_testing_only
          SENDGRID_API_KEY=${SENDGRID_API_KEY}
          GOOGLE_CLIENT_ID=mock-google-client-id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=mock-google-client-secret
          EOF

      - name: Install app dependencies
        run: npm ci

      # e2e-tests/global-setup.ts handles DB reset and Wasp server lifecycle.

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('e2e-tests/package-lock.json') }}
          restore-keys: npm-e2e-

      - name: Install e2e dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('e2e-tests/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: e2e-tests
        # On cache hit only reinstall OS-level deps (fast); on miss do a full download.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run smoke E2E tests
        working-directory: e2e-tests
        run: npm run e2e:smoke

      - name: Upload Playwright report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: e2e-tests/playwright-report/

      - name: Dump Wasp server log on failure
        if: failure()
        run: cat /tmp/wasp-start.log || true

  publish-report:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    env:
      RAILWAY_PROJECT_NAME: flight-club-wasp
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb
      # You must add RAILWAY_API_TOKEN to your Repository Secrets
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: wasp deploy railway deploy $RAILWAY_PROJECT_NAME --existing-project-id $RAILWAY_PROJECT_ID