name: Wasp Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: "0.21.1"
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb
      WASP_TELEMETRY_DISABLE: 1

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          # Use 'npm install' instead of 'npm ci' to allow the 
          # local resolution of the generated wasp-config
          npm install

      - name: Install CLIs
        run: |
          npm i -g @wasp.sh/wasp-cli@$WASP_VERSION
          npm i -g @railway/cli

      - name: Build Wasp App
        run: |
          # 1. Generate internal SDK
          wasp deps --skip-ts-check
          # 2. Create production build in .wasp/out
          wasp build

      - name: Deploy to Railway
        run: |
          # Link the project for the CLI
          railway link $RAILWAY_PROJECT_ID
          
          # --- Deploy Server ---
          # We deploy from the .wasp/out directory which contains the Node.js server
          cd .wasp/out
          railway up --service flight-club-wasp-server --no-gitignore --path-as-root --ci
          
          # --- Deploy Client ---
          # The static web-app is inside the build output
          cd web-app
          railway up --service flight-club-wasp-client --no-gitignore --path-as-root --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}