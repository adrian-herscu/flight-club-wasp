name: Wasp Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'app/docs/**'
  workflow_dispatch:

env:
  WASP_VERSION: 0.21.1
  WASP_TELEMETRY_DISABLE: 1

jobs:
  api-tests:
    uses: ./.github/workflows/_reusable-api-tests.yml
    with:
      timeout-minutes: 10
      db-name: flight_club_api
      database-url: postgresql://postgres:postgres@localhost:5432/flight_club_api

  e2e-smoke:
    uses: ./.github/workflows/_reusable-e2e.yml
    with:
      timeout-minutes: 25
      db-name: flight_club_e2e
      database-url: postgresql://postgres:postgres@localhost:5432/flight_club_e2e
      mode: smoke
      browser: chromium
      upload-report-artifact: false
    secrets:
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

  deploy:
    needs:
      - api-tests
      - e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_PROJECT_NAME: flight-club-wasp
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb
      RAILWAY_ENVIRONMENT_ID: 63662340-c373-4b8a-8b0c-0829d6c5e7d0
      # You must add RAILWAY_API_TOKEN to your Repository Secrets
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: wasp deploy railway deploy $RAILWAY_PROJECT_NAME --existing-project-id $RAILWAY_PROJECT_ID