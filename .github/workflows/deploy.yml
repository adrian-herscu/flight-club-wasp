name: Wasp Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: "0.21.1"
      RAILWAY_PROJECT_NAME: flight-club-wasp
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb
      WASP_TELEMETRY_DISABLE: 1

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Install CLIs
        run: |
          npm i -g @wasp.sh/wasp-cli@$WASP_VERSION
          npm install -g @railway/cli

      - name: Build and Deploy
        run: |
          cd app

          # 1. Build the Wasp app for production.
          wasp build

          # 2. Deploy from the generated build folder.
          cd .wasp/build
          railway link $RAILWAY_PROJECT_ID
          railway up
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}