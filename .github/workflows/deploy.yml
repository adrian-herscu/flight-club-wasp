name: Wasp Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: "0.21.1"
      RAILWAY_PROJECT_NAME: flight-club-wasp
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12"
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Wasp
        run: npm i -g @wasp.sh/wasp-cli@$WASP_VERSION

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Build and Deploy
        run: |
          # 1. Generate internal SDK so TypeScript can find 'wasp-config'
          wasp deps
          
          # 2. Build the project
          wasp build
          
          # 3. Navigate to the build output
          cd .wasp/build
          
          # 4. Link and Deploy
          railway link $RAILWAY_PROJECT_ID
          railway up
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
