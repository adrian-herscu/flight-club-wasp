name: Wasp Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  WASP_VERSION: 0.21.1
  WASP_TELEMETRY_DISABLE: 1

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_club_api
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Create API test env file
        uses: ./.github/actions/setup-ci-env
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/flight_club_api
          create-env-server: 'false'
          create-api-env-test: 'true'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-api-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-api-

      - name: Run API tests
        uses: ./.github/actions/run-api-tests

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flight_club_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flight_club_e2e

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Create app env file for CI
        uses: ./.github/actions/setup-ci-env
        with:
          database-url: postgresql://postgres:postgres@localhost:5432/flight_club_e2e
          sendgrid-api-key: ${{ secrets.SENDGRID_API_KEY }}
          create-env-server: 'true'
          create-api-env-test: 'false'

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-e2e-

      - name: Run smoke E2E tests
        uses: ./.github/actions/run-e2e-tests
        with:
          mode: smoke
          browser: chromium

      - name: Dump Wasp server log on failure
        if: failure()
        run: cat wasp-dev.log || true

  deploy:
    needs:
      - api-tests
      - e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_PROJECT_NAME: flight-club-wasp
      RAILWAY_PROJECT_ID: d5b510d7-cad3-4b81-b785-f5ec6f8b3ddb
      RAILWAY_ENVIRONMENT_ID: 63662340-c373-4b8a-8b0c-0829d6c5e7d0
      # You must add RAILWAY_API_TOKEN to your Repository Secrets
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: wasp deploy railway deploy $RAILWAY_PROJECT_NAME --existing-project-id $RAILWAY_PROJECT_ID