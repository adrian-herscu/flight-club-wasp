name: Reusable E2E Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 25
      db-name:
        description: Postgres database name for service container
        required: false
        type: string
        default: flight_club_e2e
      database-url:
        description: DATABASE_URL for app/.env.server and test runtime
        required: true
        type: string
      mode:
        description: "E2E mode: smoke or regression"
        required: false
        type: string
        default: smoke
      browser:
        description: Playwright browser project name
        required: false
        type: string
        default: chromium
      upload-report-artifact:
        description: Upload Playwright report artifact
        required: false
        type: boolean
        default: false
      report-artifact-name:
        description: Artifact name for Playwright report
        required: false
        type: string
        default: playwright-report
    secrets:
      SENDGRID_API_KEY:
        required: false

permissions:
  contents: read

env:
  WASP_VERSION: 0.21.1
  WASP_TELEMETRY_DISABLE: 1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.db-name }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: ${{ inputs.database-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and Wasp CLI
        uses: ./.github/actions/setup-wasp

      - name: Create app env file for CI
        uses: ./.github/actions/setup-ci-env
        with:
          database-url: ${{ inputs.database-url }}
          sendgrid-api-key: ${{ secrets.SENDGRID_API_KEY }}
          create-env-server: 'true'
          create-api-env-test: 'false'

      # tests/e2e/global-setup.ts handles DB reset and Wasp server lifecycle.

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-e2e-

      - name: Install e2e dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Setup Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          cache-key: playwright-${{ inputs.browser }}-${{ hashFiles('package-lock.json') }}
          browser: ${{ inputs.browser }}

      - name: Run smoke E2E tests
        if: ${{ inputs.mode == 'smoke' }}
        run: npx playwright test --config=tests/e2e/playwright.config.ts --project=${{ inputs.browser }} --grep @smoke --reporter=html,github

      - name: Run regression E2E tests
        if: ${{ inputs.mode == 'regression' }}
        run: npx playwright test --config=tests/e2e/playwright.config.ts --project=${{ inputs.browser }}

      - name: Upload Playwright report artifact
        if: ${{ always() && inputs.upload-report-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report-artifact-name }}
          path: playwright-report/

      - name: Dump Wasp server log on failure
        if: failure()
        run: cat wasp-dev.log || true
