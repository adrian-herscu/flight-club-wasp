name: Nightly Deep Checks

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  WASP_VERSION: 0.21.1
  WASP_TELEMETRY_DISABLE: 1

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests-full:
    uses: ./.github/workflows/_reusable-api-tests.yml
    with:
      timeout-minutes: 15
      db-name: flight_club_api
      database-url: postgresql://postgres:postgres@localhost:5432/flight_club_api
      with-coverage: true
      upload-coverage-artifact: true
      coverage-artifact-name: api-tests-coverage-nightly

  e2e-regression:
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    uses: ./.github/workflows/_reusable-e2e.yml
    with:
      timeout-minutes: 45
      db-name: flight_club_e2e
      database-url: postgresql://postgres:postgres@localhost:5432/flight_club_e2e
      mode: regression
      browser: ${{ matrix.browser }}
      upload-report-artifact: true
      report-artifact-name: playwright-report-nightly-${{ matrix.browser }}
    secrets:
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}

  prepare-pages-artifact:
    needs:
      - api-tests-full
      - e2e-regression
    if: ${{ needs.api-tests-full.result == 'success' && needs.e2e-regression.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download API coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: api-tests-coverage-nightly
          path: _artifacts/api

      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-nightly-chromium
          path: _artifacts/e2e/chromium

      - name: Download Firefox Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-nightly-firefox
          path: _artifacts/e2e/firefox

      - name: Download WebKit Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-nightly-webkit
          path: _artifacts/e2e/webkit

      - name: Build combined Pages site
        run: |
          mkdir -p site/api site/e2e/chromium site/e2e/firefox site/e2e/webkit
          cp -R _artifacts/api/. site/api/
          cp -R _artifacts/e2e/chromium/. site/e2e/chromium/
          cp -R _artifacts/e2e/firefox/. site/e2e/firefox/
          cp -R _artifacts/e2e/webkit/. site/e2e/webkit/

          cat > site/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Nightly Test Reports</title>
            </head>
            <body>
              <h1>Nightly Test Reports</h1>
              <ul>
                <li><a href="./e2e/chromium/index.html">E2E Playwright Report (Chromium)</a></li>
                <li><a href="./e2e/firefox/index.html">E2E Playwright Report (Firefox)</a></li>
                <li><a href="./e2e/webkit/index.html">E2E Playwright Report (WebKit)</a></li>
                <li><a href="./api/index.html">API Coverage Report</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: Upload combined report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publish-report:
    needs: prepare-pages-artifact
    if: ${{ needs.prepare-pages-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
