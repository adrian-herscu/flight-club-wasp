name: Setup Wasp
description: Set up Node.js and install the pinned Wasp CLI (run actions/checkout before using this action)

inputs:
  node-version:
    description: Node.js version to install
    default: '22.12'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Wasp CLI
      shell: bash
      working-directory: ${{ github.workspace }}
      # WASP_VERSION is expected to be set at the calling workflow level
      run: npm i -g @wasp.sh/wasp-cli@${{ env.WASP_VERSION }}
