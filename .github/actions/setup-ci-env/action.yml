name: Setup CI env files
description: Create .env.server for CI jobs

inputs:
  database-url:
    description: PostgreSQL connection URL to write in env files
    required: true
  sendgrid-api-key:
    description: SendGrid API key used in .env.server
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create .env.server
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        cat > .env.server << EOF
        DATABASE_URL=${{ inputs.database-url }}
        SKIP_EMAIL_VERIFICATION_IN_DEV=true
        JWT_SECRET=supersecretjwtkey_for_ci_testing_only
        SENDGRID_API_KEY=${{ inputs.sendgrid-api-key }}
        GOOGLE_CLIENT_ID=mock-google-client-id.apps.googleusercontent.com
        GOOGLE_CLIENT_SECRET=mock-google-client-secret
        EOF
