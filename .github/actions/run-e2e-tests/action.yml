name: Run E2E tests
description: Install dependencies, generate Prisma client, set up Playwright, and run smoke or regression E2E tests

inputs:
  browser:
    description: Playwright browser project name
    required: false
    default: chromium
  mode:
    description: 'E2E mode: smoke or regression'
    required: false
    default: smoke

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm ci

    # - name: Generate Prisma client
    #   shell: bash
    #   working-directory: ${{ github.workspace }}
    #   run: npx prisma generate

    - name: Setup Playwright browsers
      uses: ./.github/actions/setup-playwright
      with:
        cache-key: playwright-${{ inputs.browser }}-${{ hashFiles('package-lock.json') }}
        browser: ${{ inputs.browser }}

    - name: Reset database
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm run wasp:db:reset

    - name: Start Wasp server in background
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npm run wasp:start:bg

    - name: Run smoke E2E tests
      if: ${{ inputs.mode == 'smoke' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: PLAYWRIGHT_HTML_REPORT=out/playwright-report npx playwright test --config=tests/e2e/playwright.config.ts --project=${{ inputs.browser }} --grep @smoke --reporter=html,github

    - name: Run regression E2E tests
      if: ${{ inputs.mode == 'regression' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: npx playwright test --config=tests/e2e/playwright.config.ts --project=${{ inputs.browser }}
